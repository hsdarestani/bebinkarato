name: Activate existing BebinKarato on shared VPS
on:
  push:
    branches: [ops/shared-vps-source-audit-20261022]
    paths: [.github/workflows/shared-vps-activate.yml]
permissions:
  contents: read
concurrency:
  group: bebinkarato-shared-activation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate provider access and absence of a competing poller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,sys
          def call(url,data=None,headers={}):
              try:
                  req=urllib.request.Request(url,data=json.dumps(data).encode() if data is not None else None,headers=headers)
                  with urllib.request.urlopen(req,timeout=40) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print("PROVIDER_HTTP_ERROR",e.code);sys.exit(1)
              except Exception:
                  print("PROVIDER_CONNECTION_ERROR");sys.exit(1)
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          assert token
          base="https://api.telegram.org/bot"+token+"/"
          assert call(base+"getMe")["ok"]
          assert not call(base+"getWebhookInfo")["result"]["url"], "Existing webhook; refusing polling cutover"
          assert call(base+"getUpdates?timeout=10&limit=1")["ok"]
          print("TELEGRAM_VALID_NO_WEBHOOK_NO_POLLING_CONFLICT")
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          result=call("https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/run/@cf/meta/llama-3.1-8b-instruct-fast",{"messages":[{"role":"user","content":"Reply OK"}],"max_tokens":8},{"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
          assert result.get("success") and result.get("result")
          print("CLOUDFLARE_REAL_INFERENCE_OK")
          PY
      - name: Preserve data and activate only the existing application
        uses: appleboy/ssh-action@v1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          envs: TELEGRAM_BOT_TOKEN,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID,ADMIN_PASSWORD
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 300 9
            cd /opt/bebinkarato/app
            test -r docker-compose.shared-vps.yml
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            cp -p .env ".env.before-activation-$stamp"
            docker exec bebinkarato python -c 'import sqlite3,datetime; s=sqlite3.connect("/data/bebinkarato.db"); d=sqlite3.connect("/data/pre-activation-"+datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")+".db"); s.backup(d); d.close(); s.close(); print("SQLITE_BACKUP_OK")'
            python3 - <<'PY'
            import os,tempfile
            from pathlib import Path
            path=Path(".env")
            lines=path.read_text().splitlines()
            keys=["TELEGRAM_BOT_TOKEN","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","ADMIN_PASSWORD"]
            incoming={k:os.environ[k] for k in keys if os.environ.get(k)}
            assert all(k in incoming for k in keys)
            assert all("\n" not in v and "\r" not in v for v in incoming.values())
            lines=[l for l in lines if l.split("=",1)[0] not in incoming]
            def quote(v): return "'"+v.replace("\\","\\\\").replace("'","\\'")+"'"
            lines.extend(k+"="+quote(v) for k,v in incoming.items())
            with tempfile.NamedTemporaryFile(mode="w",dir=".",delete=False) as f:
                f.write("\n".join(lines)+"\n");os.chmod(f.name,0o600);tmp=f.name
            os.replace(tmp,path)
            PY
            docker compose -p bebinkarato-shared -f docker-compose.yml -f docker-compose.shared-vps.yml config --quiet
            docker compose -p bebinkarato-shared -f docker-compose.yml -f docker-compose.shared-vps.yml up -d --no-deps --no-build app
            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 http://127.0.0.1:8106/health > /tmp/bebin-health-check.json; then break; fi
              sleep 2
            done
            python3 - <<'PY'
            import json,os,urllib.request,base64
            h=json.load(open("/tmp/bebin-health-check.json"))
            assert h["ok"] and h["telegram_configured"] and h["cloudflare_configured"] and h["admin_configured"]
            req=urllib.request.Request("http://127.0.0.1:8106/admin",headers={"Authorization":"Basic "+base64.b64encode(("admin:"+os.environ["ADMIN_PASSWORD"]).encode()).decode()})
            with urllib.request.urlopen(req,timeout=10) as r: assert r.status==200
            print("BOT_AND_ADMIN_HEALTH_OK")
            PY
            systemctl is-active --quiet rednotedownloader
            nginx -t
