name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS }}
          envs: TELEGRAM_BOT_TOKEN,CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID,ADMIN_PASSWORD
          script_stop: true
          script: |
            set -eu
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 300 9
            case " $(hostname -I) " in
              *" 143.20.60.195 "*) : ;;
              *) echo "Unexpected deployment target"; exit 1 ;;
            esac
            if ! command -v docker >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker.io git curl
            fi
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update
              apt-get install -y docker-compose-v2 || apt-get install -y docker-compose-plugin
            fi

            mkdir -p /opt/bebinkarato
            if [ ! -d /opt/bebinkarato/app/.git ]; then
              git clone https://github.com/hsdarestani/bebinkarato.git /opt/bebinkarato/app
            fi

            cd /opt/bebinkarato/app
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data

            umask 077
            {
              printf '%s\n' "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
              printf '%s\n' "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
              printf '%s\n' "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
              printf '%s\n' "ADMIN_USERNAME=admin"
              printf '%s\n' "ADMIN_PASSWORD=$ADMIN_PASSWORD"
              printf '%s\n' "DEFAULT_TIMEZONE=Asia/Tehran"
              printf '%s\n' "FREE_AI_REQUESTS=60"
              printf '%s\n' "FREE_VOICE_MINUTES=20"
            } > .env

            # Nginx owns the server's shared 80/443 ports and HTTPS.
            # Only restart this application's existing container.
            docker compose -f docker-compose.yml -f docker-compose.shared-vps.yml up -d --no-deps --build app

            docker compose -f docker-compose.yml -f docker-compose.shared-vps.yml exec -T app python scripts/smoke.py

            READY=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8106/health >/dev/null 2>&1 \
                 && curl -fsS --max-time 5 https://bebinkarato.smarbiz.sbs/health >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 3
            done
            if [ "$READY" -ne 1 ]; then
              echo "BebinKarato health check failed"
              exit 1
            fi
            systemctl is-active --quiet rednotedownloader
            nginx -t
            echo "BEBINKARATO_SHARED_VPS_DEPLOYMENT_OK"
