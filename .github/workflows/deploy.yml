name: Validate and deploy
on:
  push:
    branches: [main]
    paths: [app/**, scripts/**, Dockerfile, requirements.txt, docker-compose.yml, docker-compose.shared-vps.yml, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bebinkarato-shared-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m compileall -q app scripts
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy only existing application while retaining runtime secrets and data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 10m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 600 9
            cd /opt/bebinkarato/app
            test -s .env
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            cp -p .env ".env.before-deploy-$stamp"
            docker exec bebinkarato python -c 'import sqlite3,datetime; s=sqlite3.connect("/data/bebinkarato.db"); d=sqlite3.connect("/data/pre-deploy-"+datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")+".db"); s.backup(d); d.close(); s.close()'
            previous=$(git rev-parse HEAD)
            previous_image=$(docker inspect -f '{{.Image}}' bebinkarato)
            git fetch origin main
            runtime_changed=$(git diff --name-only "$previous" origin/main -- app scripts Dockerfile requirements.txt | wc -l)
            git checkout --detach origin/main
            docker compose -p bebinkarato-shared -f docker-compose.yml -f docker-compose.shared-vps.yml config --quiet
            rollback() {
              echo "Deployment failed; restoring previous application image and source"
              git checkout --detach "$previous"
              printf 'services:\n  app:\n    image: %s\n' "$previous_image" > .rollback-image.yml
              docker compose -p bebinkarato-shared -f docker-compose.yml -f docker-compose.shared-vps.yml -f .rollback-image.yml up -d --no-deps --no-build app
              rm -f .rollback-image.yml
              exit 1
            }
            if [ "$runtime_changed" -gt 0 ]; then
              test "$(df -Pk / | awk 'NR==2 {print $4}')" -gt 1500000
              docker compose -p bebinkarato-shared -f docker-compose.yml -f docker-compose.shared-vps.yml build app || rollback
            fi
            docker compose -p bebinkarato-shared -f docker-compose.yml -f docker-compose.shared-vps.yml up -d --no-deps --no-build app || rollback
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 4 http://127.0.0.1:8106/health >/dev/null; then ready=1;break;fi
              sleep 2
            done
            [ "$ready" = 1 ] || rollback
            curl -fsS --max-time 15 https://bebinkarato.smarbiz.sbs/health >/dev/null || rollback
            systemctl is-active --quiet rednotedownloader
            nginx -t
            echo BEBINKARATO_INDEPENDENT_DEPLOYMENT_OK
