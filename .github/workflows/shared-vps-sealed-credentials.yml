          -----END CERTIFICATE-----
          CERT
          openssl x509 -in /tmp/recipient.crt -noout >/dev/null
          : > /tmp/service.env
          for key in TELEGRAM_BOT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PASSWORD; do
            if [ -n "${!key:-}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> /tmp/service.env
              echo "AVAILABLE:$key"
            else
              echo "NOT_CONFIGURED:$key"
            fi
          done
          openssl cms -encrypt -binary -aes256 -in /tmp/service.env -out /tmp/credentials.cms -outform DER -recip /tmp/recipient.crt
          shred -u /tmp/service.env || rm -f /tmp/service.env
          echo 'ENCRYPTED_CMS_BASE64_BEGIN'
          base64 -w0 /tmp/credentials.cms | fold -w 72
          echo 'ENCRYPTED_CMS_BASE64_END'
          rm -f /tmp/credentials.cms
